<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <header class="header">Dashboard</header>

    <aside class="sidebar">
        <h3>Menu</h3>
        <p>Home</p>
        <p>Profile</p>
        <p>Settings</p>
        <p>Logout</p>
    </aside>

    <main class="content">
        <div class="card">Users</div>
        <div class="card">Orders</div>
        <div class="card">Sales</div>
        <div class="card">Revenue</div>
        <div class="card">Products</div>
        <div class="card">Reports</div>
    </main>

</div>

</body>
</html>
